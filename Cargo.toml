[workspace]
resolver = "2"
members = [
    "packages/core",
    "packages/assembler",
    "packages/devices/rust",
    "packages/cli",
    "packages/wasm-api",
    "packages/desktop",
    "packages/core-8085",
    "packages/assembler-8085",
    "packages/wasm-api-8085",
    "packages/cli-8085",
    "packages/desktop-8085",
    "packages/core-8051",
    "packages/assembler-8051",
    "packages/wasm-api-8051",
    "packages/cli-8051",
]

[workspace.package]
version = "1.1.4"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Abu Sufian Sarkar <abu@cyberdude.com>"]
repository = "https://github.com/abuXsarkar/modern8086"
homepage = "https://github.com/abuXsarkar/modern8086"
readme = "README.md"

[workspace.dependencies]
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"

[profile.dev]
opt-level = 1
