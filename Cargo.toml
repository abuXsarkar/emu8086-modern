[workspace]
resolver = "2"
members = [
    "packages/core",
    "packages/assembler",
    "packages/devices/rust",
    "packages/cli",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Abu Sufian Sarkar <abu@cyberdude.com>"]
repository = "https://github.com/abuXsarkar/emu8086-modern"
homepage = "https://github.com/abuXsarkar/emu8086-modern"
readme = "README.md"

[workspace.dependencies]
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"

[profile.dev]
opt-level = 1
