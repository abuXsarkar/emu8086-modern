<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E3A8A" />
    <meta name="description" content="Modern, open-source 8086 emulator and assembly IDE for students." />

    <!-- Favicons: SVG for browsers that support it (sharpest); rasters
         for everyone else, paired by size so the OS picks the closest
         match without resizing artefacts. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- iOS home-screen icon — opaque background per Apple's spec. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph + Twitter cards. The og-image is generated by the
         designer's brand sheet; harvest from `.design/v3/` when it's
         exported. -->
    <meta property="og:title" content="modern8086" />
    <meta property="og:description" content="A modern, open-source 8086 emulator and assembly IDE for students." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>modern8086</title>
    <script>
      // Pre-paint theme application. Reads the same key the React app
      // writes. Default is the paper/light theme; only an explicit
      // "vs-dark" in storage opts into dark mode before first paint.
      (function () {
        try {
          var v = localStorage.getItem("modern8086.editor-theme");
          if (v === "vs-dark") document.body && document.body.classList.add("dark");
          // The script runs before <body> exists; queue the class swap
          // for the next microtask so the body element is available.
          if (!document.body) {
            document.addEventListener("DOMContentLoaded", function () {
              var v2 = localStorage.getItem("modern8086.editor-theme");
              if (v2 === "vs-dark") document.body.classList.add("dark");
            });
          }
        } catch (e) {
          /* ignore quota / disabled-storage errors */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
