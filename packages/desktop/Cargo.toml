[package]
name = "modern8086-desktop"
description = "Native desktop shell (Tauri) hosting the modern8086 web IDE."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

# Two artifacts come out of this crate: an `staticlib`/`cdylib`/`rlib`
# triple used by the (future) mobile entry, and a `main.rs` binary
# that the desktop bundler builds.
[lib]
name = "modern8086_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# tauri-plugin-opener: opens external URLs (Documentation, Report
#   Issue, etc.) in the user's default browser. Works on desktop
#   AND mobile, so it's an unconditional dependency.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only plugins. tauri-plugin-window-state and
# tauri-plugin-updater are gated upstream on `cfg(desktop)` and
# don't compile when cross-targeting Android or iOS — so we
# target-gate them here too. The Rust code in src/lib.rs is
# matching `#[cfg(desktop)]` blocks.
#
# - tauri-plugin-window-state: remembers window size + position
#   across launches.
# - tauri-plugin-updater: serves auto-updates from GitHub Releases.
#   Runtime check is gated by `updater.active` in tauri.conf.json,
#   which flips on only after signing certs land — so this is a
#   no-op in practice until then.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"

[features]
# `devtools` mirrors Tauri's own feature of the same name: when on,
# the webview's right-click → Inspect surface is enabled and the
# View menu picks up a "Toggle Developer Tools" item. Off in
# release builds (debug builds get devtools automatically via
# `cfg(debug_assertions)`).
devtools = []
