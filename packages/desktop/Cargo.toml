[package]
name = "emu8086-desktop"
description = "Native desktop shell (Tauri) hosting the emu8086-modern web IDE."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

# Two artifacts come out of this crate: an `staticlib`/`cdylib`/`rlib`
# triple used by the (future) mobile entry, and a `main.rs` binary
# that the desktop bundler builds.
[lib]
name = "emu8086_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
