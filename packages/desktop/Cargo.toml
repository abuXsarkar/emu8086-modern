[package]
name = "emu8086-desktop"
description = "Native desktop shell (Tauri) hosting the emu8086-modern web IDE."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

# Two artifacts come out of this crate: an `staticlib`/`cdylib`/`rlib`
# triple used by the (future) mobile entry, and a `main.rs` binary
# that the desktop bundler builds.
[lib]
name = "emu8086_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# tauri-plugin-opener: opens external URLs (Documentation, Report
#   Issue, etc.) in the user's default browser. Successor to the
#   deprecated `Shell::open` path on tauri-plugin-shell 2.x.
# tauri-plugin-window-state: remembers window size, position, and
#   maximised state across launches. Standard QoL — IDE users expect
#   their window to come back where they left it.
# tauri-plugin-updater: serves auto-updates from GitHub Releases.
#   The plugin is compiled in but the runtime check is gated on
#   `updater.active` in tauri.conf.json; that flag flips to true
#   only after Apple Developer ID + Authenticode signing land, so
#   we don't ship a self-update that pushes unsigned binaries.
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# `devtools` mirrors Tauri's own feature of the same name: when on,
# the webview's right-click → Inspect surface is enabled and the
# View menu picks up a "Toggle Developer Tools" item. Off in
# release builds (debug builds get devtools automatically via
# `cfg(debug_assertions)`).
devtools = []
