[package]
name = "modern8085-cli"
description = "Headless Intel 8085 runner — assemble and execute 8085 programs from the command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[[bin]]
name = "m85"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
modern8085-core = { path = "../core-8085" }
modern8085-assembler = { path = "../assembler-8085" }

[lints.clippy]
needless_pass_by_value = "allow"
ptr_arg = "allow"
