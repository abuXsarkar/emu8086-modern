[package]
name = "modern8085-desktop"
description = "Native desktop shell (Tauri) hosting the modern8085 web IDE."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

# Same shape as modern8086-desktop: a (future) mobile-friendly
# staticlib/cdylib/rlib triple plus a binary entry. Lib runs the
# Tauri builder; main.rs is the desktop entrypoint.
[lib]
name = "modern8085_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"

[features]
devtools = []
