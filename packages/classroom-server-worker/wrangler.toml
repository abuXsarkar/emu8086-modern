name = "modern8086-classroom"
main = "src/worker.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# All classroom rooms live inside a single Durable Object instance.
# This mirrors the Node server's single-process model and keeps the
# routing trivial: every connection lands in the same DO and the DO
# owns the per-room state internally.
#
# If usage ever grows past a single DO's headroom (CF says ~10k
# concurrent connections per DO is comfortable), the next step is to
# shard by `idFromName(roomId)` and split the Hub DO into per-room
# DOs. The Room class stays untouched; only the routing changes.
[[durable_objects.bindings]]
name = "HUB"
class_name = "ClassroomHubDO"

[[migrations]]
tag = "v1"
# `new_sqlite_classes` (not `new_classes`) is required for Durable
# Objects on Cloudflare's Workers Free plan. Workers Paid permits
# either; SQLite-backed is the recommended default for new code
# regardless because it's strictly more capable than the legacy
# KV-backed storage. From the DO's point of view the API is
# identical — `state.storage.put/get/setAlarm/...` work the same;
# only the backend is different. No code change in `do.ts` needed.
new_sqlite_classes = ["ClassroomHubDO"]

# The HMAC secret used to sign host tokens. Set with:
#   wrangler secret put M86_CLASSROOM_HMAC_SECRET
# To rotate, additionally set M86_CLASSROOM_HMAC_SECRET_PREVIOUS
# so live host tokens minted under the old secret keep validating
# through the next session window.

[observability]
enabled = true
