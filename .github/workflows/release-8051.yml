name: Release (m51)

# Runs on `m51-v*.*.*` tags. Builds the modern8051-cli native binary
# for four platforms, attaches them + a checksums.txt to a GitHub
# Release.
#
# The trailing `-m51` infix in the tag pattern keeps this workflow
# independent of the existing 8086 and 8085 release pipelines.
#
# Tag flow:
#   git tag -a m51-v0.1.0 -m "m51 release 0.1.0"
#   git push origin m51-v0.1.0
# The workflow creates / updates the GitHub Release automatically.
#
# Once a release exists, `@modern8086/cli-8051`'s postinstall (the npm
# wrapper at packages/cli-npm-8051) flips from "inert / log + exit 0"
# to "download the asset for this platform" — the asset names below
# match what scripts/install.js looks for.

on:
  push:
    tags:
      - "m51-v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build m51 (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset: m51-linux-x86_64.tar.gz
            exe: m51
          - target: x86_64-apple-darwin
            runner: macos-latest
            asset: m51-macos-x86_64.tar.gz
            exe: m51
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: m51-macos-aarch64.tar.gz
            exe: m51
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset: m51-windows-x86_64.zip
            exe: m51.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: m51-${{ matrix.target }}
      - name: Build
        run: cargo build --release -p modern8051-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} dist/${{ matrix.exe }}
          cd dist
          if [[ "${{ matrix.asset }}" == *.zip ]]; then
            7z a "${{ matrix.asset }}" "${{ matrix.exe }}"
          else
            tar -czf "${{ matrix.asset }}" "${{ matrix.exe }}"
          fi
          rm "${{ matrix.exe }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 7

  desktop:
    name: Desktop bundle (${{ matrix.platform.name }})
    # Mirrors the 8086 / 8085 desktop jobs — packages/desktop-8051 is a
    # Tauri 2 shell that loads the prebuilt /8051/ web bundle.
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            args: ""
          - name: macos-universal
            runner: macos-latest
            args: "--target universal-apple-darwin"
          - name: windows-x86_64
            runner: windows-latest
            args: ""
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.runner == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: tauri-8051-${{ matrix.platform.name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1"

      - name: Build wasm pkgs (web build references all three)
        run: |
          wasm-pack build packages/wasm-api --target web --out-dir pkg --release
          wasm-pack build packages/wasm-api-8085 --target web --out-dir pkg --release
          wasm-pack build packages/wasm-api-8051 --target web --out-dir pkg --release

      - name: Tauri build (unsigned)
        if: vars.SIGNING_ENABLED != 'true'
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: packages/desktop-8051
          args: ${{ matrix.platform.args }}

      - name: Tauri build (signed)
        if: vars.SIGNING_ENABLED == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_SIGN_CERT_P12 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        with:
          projectPath: packages/desktop-8051
          args: ${{ matrix.platform.args }}

      - name: Collect desktop artifacts
        shell: bash
        run: |
          mkdir -p dist
          find target -path '*/release/bundle/*' \
            \( -name '*.deb' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*.app.tar.gz' \
               -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.nsis.zip' \) \
            -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist/ || true

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-8051-${{ matrix.platform.name }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten + checksum
        run: |
          mkdir -p out
          find artifacts -type f \
            \( -name '*.tar.gz' -o -name '*.zip' \
               -o -name '*.deb' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*.app.tar.gz' \
               -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.nsis.zip' \) \
            -exec cp {} out/ \;
          cd out
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: Read tag version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#m51-v}" >> "$GITHUB_OUTPUT"
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          name: m51 v${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: |
            modern8051 CLI (`m51`) v${{ steps.ver.outputs.version }}.

            Sibling release to modern8086 and modern8085 — separate tag
            scheme (`m51-v*`) so the three release pipelines stay
            independent.

            ### Install

            ```bash
            # Cross-platform via npm (Node 18+):
            npm install -g @modern8086/cli-8051@${{ steps.ver.outputs.version }}

            # Or grab the platform-specific archive below and put the
            # binary on your PATH.
            ```

            ### What this is

            Headless 8051 assembler + executor. The same Rust core and
            assembler that powers the web IDE at
            https://modern8086.com/8051. Useful for autograding, CI
            tests, and any scripted lab workflow.

            See `packages/cli-8051/README.md` in the source tree for
            full usage.
          files: |
            out/*
          fail_on_unmatched_files: true
