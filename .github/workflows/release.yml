name: Release

# Runs on every `v*.*.*` tag pushed to the repo. Builds:
#   - emu8086-cli native binary for four platforms
#   - emu8086-desktop Tauri bundles (DEB/AppImage on Linux, DMG/.app
#     on macOS, MSI/NSIS on Windows)
# Uploads everything, plus a checksums.txt, to the matching GitHub
# Release.
#
# Tag flow:
#   git tag -a v1.0.0 -m "release 1.0.0"
#   git push origin v1.0.0
# Then `gh release create v1.0.0 …` from a maintainer machine; this
# workflow picks the release up and attaches binaries.
#
# Code signing: not yet wired. When Apple Developer ID and
# Authenticode certs are added to the repo secrets, the desktop-
# bundle job below picks them up automatically via tauri-action.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset: emu8086-linux-x86_64.tar.gz
            exe: emu8086
          - target: x86_64-apple-darwin
            runner: macos-latest
            asset: emu8086-macos-x86_64.tar.gz
            exe: emu8086
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: emu8086-macos-aarch64.tar.gz
            exe: emu8086
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset: emu8086-windows-x86_64.zip
            exe: emu8086.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p emu8086-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} dist/${{ matrix.exe }}
          cd dist
          if [[ "${{ matrix.asset }}" == *.zip ]]; then
            7z a "${{ matrix.asset }}" "${{ matrix.exe }}"
          else
            tar -czf "${{ matrix.asset }}" "${{ matrix.exe }}"
          fi
          rm "${{ matrix.exe }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 7

  desktop:
    name: Desktop bundle (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            args: ""
          - name: macos-universal
            runner: macos-latest
            # `--target universal-apple-darwin` produces a single
            # fat binary that runs on Intel + Apple Silicon.
            args: "--target universal-apple-darwin"
          - name: windows-x86_64
            runner: windows-latest
            args: ""
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.runner == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: tauri-${{ matrix.platform.name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1"

      - name: Build wasm-api pkg (needed by the web build that Tauri bundles)
        run: wasm-pack build packages/wasm-api --target web --out-dir pkg --release

      # Two parallel steps so we don't pass empty signing env vars
      # to tauri-action — which (counter-intuitively) treats an
      # empty APPLE_CERTIFICATE as "please try to sign" and then
      # fails on keychain import. Use repository VARIABLES (not
      # secrets) as the toggle, since `secrets` can't be used in
      # `if:` conditionals — set vars.SIGNING_ENABLED = "true"
      # once the corresponding secrets are populated and the next
      # tag picks up the signed path.
      - name: Tauri build (unsigned)
        if: vars.SIGNING_ENABLED != 'true'
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: packages/desktop
          args: ${{ matrix.platform.args }}

      - name: Tauri build (signed)
        if: vars.SIGNING_ENABLED == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_SIGN_CERT_P12 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        with:
          projectPath: packages/desktop
          args: ${{ matrix.platform.args }}

      - name: Collect desktop artifacts
        shell: bash
        run: |
          mkdir -p dist
          # Tauri drops platform-specific bundles under target/<triple>/release/bundle/
          # Collect every shippable artifact into a flat dist dir.
          find target -path '*/release/bundle/*' \
            \( -name '*.deb' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*.app.tar.gz' \
               -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.nsis.zip' \) \
            -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist/ || true

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform.name }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 7

  checksums-and-release:
    name: Checksums + attach to Release
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten + checksum
        run: |
          mkdir -p out
          find artifacts -type f \( \
              -name '*.tar.gz' -o -name '*.zip' \
              -o -name '*.deb' -o -name '*.AppImage' \
              -o -name '*.dmg' -o -name '*.app.tar.gz' \
              -o -name '*.msi' -o -name '*.exe' \
              -o -name '*.nsis.zip' \
            \) -exec cp {} out/ \;
          cd out
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*
          fail_on_unmatched_files: true

  publish-npm:
    name: Publish @emu8086/cli to npm
    needs: [checksums-and-release]
    # Gated on a repo *variable*, not a secret — `secrets` cannot be
    # referenced in `if:`. Flip `vars.NPM_PUBLISH_ENABLED = "true"` in
    # Settings → Secrets and variables → Actions → Variables once the
    # NPM_TOKEN secret is populated, and the next tag publishes
    # automatically. Keeps the workflow inert on forks and on first
    # release until the maintainer is ready.
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Read tag version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # The cli-npm shim is a thin Node wrapper that downloads the
      # right native binary on `npm install`. Keep its version in
      # lock-step with the tag so the postinstall script fetches the
      # matching asset from the just-published GitHub Release.
      - name: Sync package.json version to the tag
        working-directory: packages/cli-npm
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Publish
        working-directory: packages/cli-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # `--access public` is required for scoped packages on the
        # free npm tier. `--provenance` attaches an in-toto signed
        # SLSA-style provenance statement to the published tarball
        # so consumers can verify it really came from this CI run.
        run: npm publish --access public --provenance
