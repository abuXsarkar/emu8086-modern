name: Release

# Runs on every `v*.*.*` tag pushed to the repo. Builds:
#   - modern8086-cli native binary for four platforms
#   - modern8086-desktop Tauri bundles (DEB/AppImage on Linux, DMG/.app
#     on macOS, MSI/NSIS on Windows)
#   - modern8086 Android AAB (gated on vars.ANDROID_BUILD_ENABLED, with
#     optional auto-publish to Play Console behind vars.PLAY_STORE_UPLOAD_ENABLED)
# Uploads everything, plus a checksums.txt, to the matching GitHub
# Release.
#
# Tag flow:
#   git tag -a v1.0.0 -m "release 1.0.0"
#   git push origin v1.0.0
# Then `gh release create v1.0.0 …` from a maintainer machine; this
# workflow picks the release up and attaches binaries.
#
# Code signing: not yet wired. When Apple Developer ID and
# Authenticode certs are added to the repo secrets, the desktop-
# bundle job below picks them up automatically via tauri-action.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset: m86-linux-x86_64.tar.gz
            exe: m86
          - target: x86_64-apple-darwin
            runner: macos-latest
            asset: m86-macos-x86_64.tar.gz
            exe: m86
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: m86-macos-aarch64.tar.gz
            exe: m86
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset: m86-windows-x86_64.zip
            exe: m86.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p modern8086-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} dist/${{ matrix.exe }}
          cd dist
          if [[ "${{ matrix.asset }}" == *.zip ]]; then
            7z a "${{ matrix.asset }}" "${{ matrix.exe }}"
          else
            tar -czf "${{ matrix.asset }}" "${{ matrix.exe }}"
          fi
          rm "${{ matrix.exe }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 7

  desktop:
    name: Desktop bundle (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            args: ""
          - name: macos-universal
            runner: macos-latest
            # `--target universal-apple-darwin` produces a single
            # fat binary that runs on Intel + Apple Silicon.
            args: "--target universal-apple-darwin"
          - name: windows-x86_64
            runner: windows-latest
            args: ""
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.runner == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: tauri-${{ matrix.platform.name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1"

      - name: Build wasm-api pkg (needed by the web build that Tauri bundles)
        run: wasm-pack build packages/wasm-api --target web --out-dir pkg --release

      # Two parallel steps so we don't pass empty signing env vars
      # to tauri-action — which (counter-intuitively) treats an
      # empty APPLE_CERTIFICATE as "please try to sign" and then
      # fails on keychain import. Use repository VARIABLES (not
      # secrets) as the toggle, since `secrets` can't be used in
      # `if:` conditionals — set vars.SIGNING_ENABLED = "true"
      # once the corresponding secrets are populated and the next
      # tag picks up the signed path.
      - name: Tauri build (unsigned)
        if: vars.SIGNING_ENABLED != 'true'
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: packages/desktop
          args: ${{ matrix.platform.args }}

      - name: Tauri build (signed)
        if: vars.SIGNING_ENABLED == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_SIGN_CERT_P12 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        with:
          projectPath: packages/desktop
          args: ${{ matrix.platform.args }}

      - name: Collect desktop artifacts
        shell: bash
        run: |
          mkdir -p dist
          # Tauri drops platform-specific bundles under target/<triple>/release/bundle/
          # Collect every shippable artifact into a flat dist dir.
          find target -path '*/release/bundle/*' \
            \( -name '*.deb' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*.app.tar.gz' \
               -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.nsis.zip' \) \
            -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist/ || true

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform.name }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 7

  android:
    name: Android AAB (Play Store)
    # Gated on a repo variable so the job is inert until the
    # maintainer follows packaging/android/SETUP.md and populates
    # the keystore secrets. Without them, an unsigned AAB would
    # still build but Play Console rejects it, so save the runner
    # minutes.
    if: vars.ANDROID_BUILD_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (NDK comes from `sdkmanager` below)
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r26
        # Tauri Android targets need an NDK that supports the
        # `aarch64-linux-android` triple. r26 is the current LTS
        # branch; pin so a future SDK Manager change doesn't shift
        # us under our feet.
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Set up Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1"

      - name: Build wasm-api pkg
        run: wasm-pack build packages/wasm-api --target web --out-dir pkg --release

      - name: Install tauri-cli
        run: cargo install tauri-cli@^2 --locked

      - name: Read tag version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Initialise Tauri Android scaffold
        # `gen/android/` is gitignored — regenerated each run from
        # tauri.conf.json. Tauri 2.11+ scaffolds an
        # `app/build.gradle.kts` that already reads from
        # `rootProject.file("keystore.properties")`, so the only
        # thing we need to do is write that properties file from
        # the GitHub secrets (next step). No Gradle patching.
        working-directory: packages/desktop
        run: cargo tauri android init --ci

      - name: Decode keystore + write keystore.properties
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KS:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing — see packaging/android/SETUP.md" >&2
            exit 1
          fi
          ks_path="$RUNNER_TEMP/upload.keystore"
          echo "$KS" | base64 -d > "$ks_path"
          cat > packages/desktop/gen/android/keystore.properties <<EOF
          storeFile=$ks_path
          storePassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF

      - name: Build release APK + AAB
        # Tauri's default Android build emits one universal AAB
        # (signed via keystore.properties) and one universal APK
        # (unsigned — Tauri only signs the AAB).
        working-directory: packages/desktop
        run: cargo tauri android build --apk --aab

      - name: Sign + stage artifacts
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p dist
          v="${{ steps.ver.outputs.version }}"
          gen=packages/desktop/gen/android

          aab=$(find "$gen/app/build/outputs/bundle" -name '*.aab' | head -n1)
          if [ -z "$aab" ]; then
            echo "::error::no .aab found"; find "$gen" -name '*.aab'; exit 1
          fi
          cp "$aab" "dist/modern8086-android-${v}.aab"

          # apksigner: pick the version under build-tools/. The unsigned
          # universal APK gets signed with the same keystore as the AAB.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          unsigned=$(find "$gen/app/build/outputs/apk" -name 'app-*-unsigned.apk' | head -n1)
          if [ -z "$unsigned" ]; then
            echo "::error::no unsigned .apk found"; find "$gen" -name '*.apk'; exit 1
          fi
          signed=dist/modern8086-android-${v}.apk
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/upload.keystore" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$signed" \
            "$unsigned"
          "$apksigner" verify "$signed"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: modern8086-android-${{ steps.ver.outputs.version }}
          path: |
            dist/*.aab
            dist/*.apk
          retention-days: 7

      - name: Attach APK + AAB to GitHub Release
        # Mirror what checksums-and-release does for the CLI / desktop
        # bundles, but inline so we don't have to wire android into
        # that job's needs[] (which would block checksums when
        # ANDROID_BUILD_ENABLED is off).
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.aab
            dist/*.apk

      - name: Upload to Play Console (Internal track)
        # Second gate — once the maintainer has uploaded a first
        # build to Play Console manually and wired the Play API
        # service account, subsequent tags push to the chosen track
        # automatically. Stays on Internal by default; promote to
        # Production from the Play Console UI after sanity checks.
        if: vars.PLAY_STORE_UPLOAD_ENABLED == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.cyberdude.modern8086
          releaseFiles: dist/modern8086-android-${{ steps.ver.outputs.version }}.aab
          track: ${{ vars.PLAY_STORE_TRACK || 'internal' }}
          status: completed
          whatsNewDirectory: packaging/android/whats-new
          releaseName: ${{ steps.ver.outputs.version }}

  checksums-and-release:
    name: Checksums + attach to Release
    # Intentionally does not depend on `android` — when
    # ANDROID_BUILD_ENABLED is off the android job is skipped and
    # any `needs` reference to it cascades to a skipped checksums
    # job, which would block the rest of the pipeline.
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten + checksum
        run: |
          mkdir -p out
          find artifacts -type f \( \
              -name '*.tar.gz' -o -name '*.zip' \
              -o -name '*.deb' -o -name '*.AppImage' \
              -o -name '*.dmg' -o -name '*.app.tar.gz' \
              -o -name '*.msi' -o -name '*.exe' \
              -o -name '*.nsis.zip' \
            \) -exec cp {} out/ \;
          cd out
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*
          fail_on_unmatched_files: true

  distribution-manifests:
    name: Fill distribution manifests (Homebrew / Scoop / Chocolatey)
    needs: [checksums-and-release]
    # Always runs — these manifests are useful even when the
    # auto-publish gates below are off, because the maintainer copies
    # them by hand into the tap/bucket repos for the v1.x.0 first
    # publishes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read tag version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Generate filled manifests
        # The script downloads the just-published release assets, reads
        # checksums.txt, and writes ready-to-commit files under
        # target/packaging/.
        run: ./packaging/scripts/generate-distribution-manifests.sh "${{ steps.ver.outputs.version }}"
      - name: Bundle for the GitHub Release
        run: |
          cd target/packaging
          tar -czf "../../modern8086-distribution-manifests-${{ steps.ver.outputs.version }}.tar.gz" .
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: modern8086-distribution-manifests-*.tar.gz

  publish-npm:
    name: Publish @modern8086/cli to npm
    needs: [checksums-and-release]
    # Gated on a repo *variable*, not a secret — `secrets` cannot be
    # referenced in `if:`. Flip `vars.NPM_PUBLISH_ENABLED = "true"` in
    # Settings → Secrets and variables → Actions → Variables once the
    # NPM_TOKEN secret is populated, and the next tag publishes
    # automatically. Keeps the workflow inert on forks and on first
    # release until the maintainer is ready.
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Read tag version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # The cli-npm shim is a thin Node wrapper that downloads the
      # right native binary on `npm install`. Keep its version in
      # lock-step with the tag so the postinstall script fetches the
      # matching asset from the just-published GitHub Release.
      - name: Sync package.json version to the tag
        working-directory: packages/cli-npm
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Publish
        working-directory: packages/cli-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # `--access public` is required for scoped packages on the
        # free npm tier. `--provenance` attaches an in-toto signed
        # SLSA-style provenance statement to the published tarball
        # so consumers can verify it really came from this CI run.
        run: npm publish --access public --provenance
