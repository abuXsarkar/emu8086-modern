name: Deploy web IDE to GitHub Pages

# Pushes to main rebuild the static bundle and deploy. The workflow
# is also runnable manually via the Actions tab if you want to push
# a redeploy without changing code (e.g. after toggling Pages
# settings). Concurrency is set so only one deploy is in-flight at a
# time; a newer push on main supersedes an older still-building one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry / build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build wasm-api package
        run: wasm-pack build packages/wasm-api --target web --out-dir pkg --release

      - name: Build web bundle
        # We serve from a custom domain (modern8086.com via the
        # `CNAME` file in packages/web/public/), so `base` defaults to
        # "/". If you ever revert to the github.io sub-path deploy,
        # re-introduce `VITE_BASE: /${{ github.event.repository.name }}/`
        # so script + wasm fetches resolve under the project path.
        #
        # VITE_CLASSROOM_WS_URL is honored from a repo variable if set
        # (Settings → Secrets and variables → Actions → Variables);
        # without it the IDE shows a "couldn't reach the classroom
        # server" inline error when a teacher tries to start a session,
        # which is the correct degraded behavior for a static-only
        # deployment. Point it at a deployed
        # `@modern8086/classroom-server-worker` URL (CF Workers, free) or
        # any self-hosted relay you control.
        run: pnpm --filter @modern8086/web build
        env:
          VITE_CLASSROOM_WS_URL: ${{ vars.VITE_CLASSROOM_WS_URL }}

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Self-bootstrap: create the Pages site on first run instead
          # of failing with "Not Found" when the repo doesn't have one
          # yet. After this lands, the only thing the maintainer has
          # to do is *select* "GitHub Actions" as the source under
          # Settings → Pages — which the second deploy attempt will
          # have already auto-set if Pages was previously off.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
