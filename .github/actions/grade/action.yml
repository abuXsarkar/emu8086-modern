name: m86 grade
description: Grade an 8086 assembly submission against a YAML spec.
author: Abu Sufian Sarkar <abu@cyberdude.com>

# Composite action that:
#   1. installs Rust (stable),
#   2. builds the m86 CLI from source,
#   3. invokes `m86 grade <spec> <submission> --junit <path>`,
#   4. uploads the JUnit XML so dorothy.dorothy.io / GitHub Classroom
#      / EnricoMi/publish-unit-test-result-action can ingest it.
#
# Drop this in your assignment template:
#
#   jobs:
#     grade:
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/checkout@v4
#         - uses: abuXsarkar/modern8086/.github/actions/grade@main
#           with:
#             spec: spec.yml
#             submission: submission.asm

inputs:
  spec:
    description: Path to the YAML test spec.
    required: true
  submission:
    description: Path to the student's .asm submission.
    required: true
  junit:
    description: Path the JUnit XML report should be written to.
    required: false
    default: m86-grade.xml
  ref:
    description: modern8086 git ref to checkout for the CLI source.
    required: false
    default: main

outputs:
  junit:
    description: Path of the produced JUnit XML report.
    value: ${{ inputs.junit }}

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo build
      uses: Swatinem/rust-cache@v2

    - name: Checkout modern8086 (CLI source)
      uses: actions/checkout@v4
      with:
        repository: abuXsarkar/modern8086
        ref: ${{ inputs.ref }}
        path: ${{ runner.temp }}/modern8086

    - name: Build m86 CLI
      shell: bash
      run: |
        cargo install --path "${{ runner.temp }}/modern8086/packages/cli" --locked

    - name: Run grade
      shell: bash
      run: |
        m86 grade "${{ inputs.spec }}" "${{ inputs.submission }}" \
          --junit "${{ inputs.junit }}"

    - name: Upload JUnit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: m86-grade-junit
        path: ${{ inputs.junit }}
        if-no-files-found: warn
